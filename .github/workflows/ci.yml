name: TITAN CI / CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ============================================================================
  # 1. CODE QUALITY: LINTING & STATIC TYPE CHECKING
  # ============================================================================
  quality:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint --if-present

      - name: Run TypeScript Type Check
        run: npm run typecheck --if-present

  # ============================================================================
  # 2. AUTOMATED TESTING SUITE
  # ============================================================================
  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: titan_db
          POSTGRES_USER: titan_admin
          POSTGRES_PASSWORD: titan_secure_password_123
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Apply Database Migrations & Seeds
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          PGPASSWORD=titan_secure_password_123 psql -h localhost -U titan_admin -d titan_db -f infrastructure/init-db.sql

      - name: Run Automated Test Suites
        run: npm run test --if-present
        env:
          DATABASE_URL: postgresql://titan_admin:titan_secure_password_123@localhost:5432/titan_db
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: ci_test_jwt_secret_must_be_at_least_32_bytes_long!
          WEBHOOK_HMAC_SECRET: ci_test_webhook_hmac_secret_key_12345

  # ============================================================================
  # 3. SECURITY & DEPENDENCY AUDIT
  # ============================================================================
  security:
    name: Security Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run npm Audit
        run: npm audit --audit-level=high
        continue-on-error: true
