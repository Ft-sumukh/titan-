services:
  # ==============================================================================
  # PRIMARY DATASTORE: PostgreSQL 16+
  # ==============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: titan-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: titan_db
      POSTGRES_USER: titan_admin
      POSTGRES_PASSWORD: titan_secure_password_123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U titan_admin -d titan_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ==============================================================================
  # CACHE, MESSAGE BUFFER & PUB/SUB: Redis 7.2
  # ==============================================================================
  redis:
    image: redis:7.2-alpine
    container_name: titan-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ""
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ==============================================================================
  # S3 COMPATIBLE OBJECT STORAGE: MinIO
  # ==============================================================================
  minio:
    image: minio/minio:RELEASE.2024-01-31T22-49-04Z
    container_name: titan-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: titan_minio_admin
      MINIO_ROOT_PASSWORD: titan_minio_password_123
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local
